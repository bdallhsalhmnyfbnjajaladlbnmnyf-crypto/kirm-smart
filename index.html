import math, json, random
from pyscript import document, window
from pyodide.ffi import create_proxy

class SubModel:
    def __init__(self, data):
        self.mean = data["scaler_mean"]
        self.scale = data["scaler_scale"]
        self.W = data["coefs"]
        self.B = data["intercepts"]
        self.ready = bool(self.W) and bool(self.mean)

    def _scale(self, x):
        return [(x[i] - self.mean[i]) / self.scale[i] for i in range(len(x))]

    def _relu(self, v):
        return [a if a > 0 else 0.0 for a in v]

    def _forward(self, h):
        for i in range(len(self.W) - 1):
            Wi, Bi = self.W[i], self.B[i]
            out = []
            for k in range(len(Wi[0])):
                s = Bi[k]
                for j in range(len(h)):
                    s += h[j] * Wi[j][k]
                out.append(s)
            h = self._relu(out)
        Wi, Bi = self.W[-1], self.B[-1]
        out = []
        for k in range(len(Wi[0])):
            s = Bi[k]
            for j in range(len(h)):
                s += h[j] * Wi[j][k]
            out.append(s)
        return out

    def predict(self, x):
        if not self.ready: return None
        return self._forward(self._scale(x))[0]


class NN:
    def __init__(self, data):
        self.angle = SubModel(data["angle"])
        self.power = SubModel(data["power"])
        self.ready = self.angle.ready and self.power.ready

    def predict(self, x):
        if not self.ready: return None
        return [self.angle.predict(x), self.power.predict(x)]


weights_data = json.loads(document.getElementById("weights").textContent)
ai = NN(weights_data)
print("[AI] ready:", ai.ready)

PULL_FACTOR   = 0.16
SUBSTEPS      = 4

POCKETS = [
    (POCKET_R+4, POCKET_R+4),
    (BOARD-POCKET_R-4, POCKET_R+4),
    (POCKET_R+4, BOARD-POCKET_R-4),
    (BOARD-POCKET_R-4, BOARD-POCKET_R-4),
]

state = {
    "player_score": 0, "ai_score": 0,
    "turn": "player", "phase": "aim",
    "pocketed": 0, "fouled": False,
    "dragging": False, "drag_pos": (0, 0),
    "moving_frames": 0, "ai_wait": 0,
    "striker": {"x": 300, "y": BASELINE_Y, "vx": 0, "vy": 0, "alive": True},
    "coins": [],
}

def make_coins():
    layout = [
        (300, 268),
        (274, 284), (326, 284),
        (248, 300), (300, 300), (352, 300),
        (274, 316), (326, 316),
        (300, 332),
    ]
    return [{"x": x, "y": y, "vx": 0, "vy": 0, "alive": True} for x, y in layout]

def reset_striker():
    s = state["striker"]
    s["x"], s["y"] = 300, BASELINE_Y
    s["vx"] = s["vy"] = 0
    s["alive"] = True

def new_game():
    state["player_score"] = 0
    state["ai_score"] = 0
    state["turn"] = "player"
    state["phase"] = "aim"
    state["pocketed"] = 0
    state["fouled"] = False
    state["dragging"] = False
    state["moving_frames"] = 0
    state["coins"] = make_coins()
    reset_striker()
    update_hud()

def bodies():
    arr = [state["striker"]] if state["striker"]["alive"] else []
    arr += [c for c in state["coins"] if c["alive"]]
    return arr

def collide(a, b):
    dx, dy = b["x"] - a["x"], b["y"] - a["y"]
    d = math.hypot(dx, dy)
    a_is_s = a is state["striker"]
    b_is_s = b is state["striker"]
    if a_is_s and b_is_s: return
    mind = (COIN_R + STRIKER_R) if (a_is_s != b_is_s) else (2 * COIN_R)
    if d == 0 or d >= mind: return
    nx, ny = dx/d, dy/d
    ov = mind - d
    a["x"] -= nx*ov/2; a["y"] -= ny*ov/2
    b["x"] += nx*ov/2; b["y"] += ny*ov/2
    dvx, dvy = b["vx"]-a["vx"], b["vy"]-a["vy"]
    dot = dvx*nx + dvy*ny
    if dot > 0: return
    imp = -dot * RESTITUTION
    a["vx"] -= imp*nx; a["vy"] -= imp*ny
    b["vx"] += imp*nx; b["vy"] += imp*ny

def step_physics():
    arr = bodies()
    for b in arr:
        b["x"] += b["vx"]; b["y"] += b["vy"]
        b["vx"] *= FRICTION; b["vy"] *= FRICTION
        if math.hypot(b["vx"], b["vy"]) < MIN_SPEED:
            b["vx"] = b["vy"] = 0
    for b in arr:
        for px, py in POCKETS:
            if math.hypot(b["x"]-px, b["y"]-py) < POCKET_R*0.85:
                if b is state["striker"]:
                    state["fouled"] = True
                    b["alive"] = False
                elif b["alive"]:
                    b["alive"] = False
                    state["pocketed"] += 1
    for b in arr:
        if not b["alive"]: continue
        r = STRIKER_R if b is state["striker"] else COIN_R
        if b["x"]-r < 0:     b["x"] = r;          b["vx"] *= -WALL_BOUNCE
        if b["x"]+r > BOARD: b["x"] = BOARD-r;    b["vx"] *= -WALL_BOUNCE
        if b["y"]-r < 0:     b["y"] = r;          b["vy"] *= -WALL_BOUNCE
        if b["y"]+r > BOARD: b["y"] = BOARD-r;    b["vy"] *= -WALL_BOUNCE
    live = [b for b in arr if b["alive"]]
    for i in range(len(live)):
        for j in range(i+1, len(live)):
            collide(live[i], live[j])

def all_stopped():
    for b in bodies():
        if b["vx"] != 0 or b["vy"] != 0: return False
    return True

def ai_plan():
    alive = [c for c in state["coins"] if c["alive"]]
    if not alive: return None
    best = None
    for coin in alive:
        for px, py in POCKETS:
            feat = [coin["x"], coin["y"], px, py, BASELINE_Y,
                    coin["x"]-px, coin["y"]-py]
            pred = ai.predict(feat)
            if pred is None:
                dx, dy = coin["x"]-px, coin["y"]-py
                d = math.hypot(dx, dy) or 1
                ux, uy = dx/d, dy/d
                sx = coin["x"] + ux*(COIN_R+STRIKER_R+4)
                sx = max(STRIKER_MIN_X, min(STRIKER_MAX_X, sx))
                adx, ady = coin["x"]-sx, coin["y"]-BASELINE_Y
                ad = math.hypot(adx, ady) or 1
                angle = math.atan2(ady, adx)
                power = max(7, min(MAX_POWER, ad*0.06+6))
            else:
                angle, power = pred[0], pred[1]
            dist = math.hypot(coin["x"]-px, coin["y"]-py)
            score = -dist
            if best is None or score > best[0]:
                best = (score, angle, power, coin, (px, py))
    return best

def execute_ai_shot():
    plan = ai_plan()
    if not plan:
        state["phase"] = "moving"; return
    _, angle, power, coin, (px, py) = plan
    dx, dy = coin["x"]-px, coin["y"]-py
    d = math.hypot(dx, dy) or 1
    ux, uy = dx/d, dy/d
    gx = coin["x"] + ux*(COIN_R+STRIKER_R+4)
    sx = max(STRIKER_MIN_X, min(STRIKER_MAX_X, gx))
    state["striker"]["x"] = sx
    state["striker"]["y"] = BASELINE_Y
    err = (random.random() - 0.5) * 0.07
    ca, sa = math.cos(err), math.sin(err)
    rx, ry = ux*ca - uy*sa, ux*sa + uy*ca
    state["striker"]["vx"] = rx * power
    state["striker"]["vy"] = ry * power
    state["phase"] = "moving"
    state["pocketed"] = 0
    state["moving_frames"] = 0

def update_hud():
    document.getElementById("pScore").textContent = str(state["player_score"])
    document.getElementById("aScore").textContent = str(state["ai_score"])
    document.getElementById("coinsLeft").textContent = str(
        sum(1 for c in state["coins"] if c["alive"]))
    document.getElementById("turnLbl").textContent = (
        "أنت" if state["turn"] == "player" else "الخصم")

def switch_turn():
    state["turn"] = "ai" if state["turn"] == "player" else "player"
    state["pocketed"] = 0
    state["fouled"] = False
    reset_striker()
    state["phase"] = "aim"
    if state["turn"] == "ai": state["ai_wait"] = 45
    update_hud()

def end_shot():
    scored = state["pocketed"] > 0 and not state["fouled"]
    pts = state["pocketed"] * 10
    if state["turn"] == "player":
        state["player_score"] += pts
        if state["fouled"]: state["player_score"] -= 5
    else:
        state["ai_score"] += pts
        if state["fouled"]: state["ai_score"] -= 5
    update_hud()
    if sum(1 for c in state["coins"] if c["alive"]) == 0:
        game_over(); return
    if scored:
        state["pocketed"] = 0
        state["fouled"] = False
        reset_striker()
        state["phase"] = "aim"
        if state["turn"] == "ai": state["ai_wait"] = 45
    else:
        switch_turn()

def game_over():
    state["phase"] = "over"
    if state["player_score"] > state["ai_score"]: msg = "فزت!"
    elif state["player_score"] < state["ai_score"]: msg = "خسرت"
    else: msg = "تعادل"
    window.alert(msg + "\n" + str(state["player_score"]) + " - " + str(state["ai_score"]))
    new_game()

canvas = document.getElementById("game")
ctx = canvas.getContext("2d")

def draw():
    ctx.fillStyle = "#c89b5c"; ctx.fillRect(0, 0, BOARD, BOARD)
    ctx.strokeStyle = "rgba(120,80,40,0.13)"; ctx.lineWidth = 1
    for i in range(0, BOARD, 18):
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(BOARD, i); ctx.stroke()
    ctx.strokeStyle = "#6b4423"; ctx.lineWidth = 8
    ctx.strokeRect(4, 4, BOARD-8, BOARD-8)
    ctx.beginPath(); ctx.arc(300, 300, 90, 0, 2*math.pi)
    ctx.strokeStyle = "rgba(90,55,25,0.5)"; ctx.lineWidth = 3; ctx.stroke()
    ctx.beginPath(); ctx.moveTo(STRIKER_MIN_X-20, BASELINE_Y)
    ctx.lineTo(STRIKER_MAX_X+20, BASELINE_Y)
    ctx.strokeStyle = "rgba(90,55,25,0.35)"; ctx.lineWidth = 2; ctx.stroke()
    for px, py in POCKETS:
        ctx.beginPath(); ctx.arc(px, py, POCKET_R, 0, 2*math.pi)
        ctx.fillStyle = "#1a1008"; ctx.fill()
        ctx.strokeStyle = "#3d2410"; ctx.lineWidth = 3; ctx.stroke()
    for c in state["coins"]:
        if not c["alive"]: continue
        ctx.beginPath(); ctx.arc(c["x"], c["y"], COIN_R, 0, 2*math.pi)
        ctx.fillStyle = "#2b2b2b"; ctx.fill()
        ctx.beginPath(); ctx.arc(c["x"]-4, c["y"]-4, 4, 0, 2*math.pi)
        ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fill()
    s = state["striker"]
    if s["alive"]:
        ctx.beginPath(); ctx.arc(s["x"], s["y"], STRIKER_R, 0, 2*math.pi)
        ctx.fillStyle = "#ffffff"; ctx.fill()
        ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 2; ctx.stroke()
    if state["dragging"] and state["phase"] == "aim" and state["turn"] == "player":
        dx, dy = s["x"] - state["drag_pos"][0], s["y"] - state["drag_pos"][1]
        d = math.hypot(dx, dy)
        if d > 5:
            ux, uy = dx/d, dy/d
            power = min(d*PULL_FACTOR, MAX_POWER)
            ex, ey = s["x"]+ux*power*14, s["y"]+uy*power*14
            ctx.beginPath(); ctx.moveTo(s["x"], s["y"]); ctx.lineTo(ex, ey)
            ctx.strokeStyle = "rgba(200,40,40,0.85)"
            ctx.lineWidth = 3
            ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([])
            ctx.beginPath(); ctx.arc(ex, ey, 5, 0, 2*math.pi)
            ctx.fillStyle = "rgba(200,40,40,0.85)"; ctx.fill()

def to_board(event):
    r = canvas.getBoundingClientRect()
    return ((event.clientX - r.left) * BOARD / r.width,
            (event.clientY - r.top)  * BOARD / r.height)

def on_down(event):
    if state["phase"] != "aim" or state["turn"] != "player": return
    x, y = to_board(event)
    s = state["striker"]
    if math.hypot(x - s["x"], y - s["y"]) < STRIKER_R + 40:
        state["dragging"] = True
        state["drag_pos"] = (x, y)

def on_move(event):
    if state["dragging"]:
        state["drag_pos"] = to_board(event)

def on_up(event):
    if not state["dragging"]: return
    state["dragging"] = False
    x, y = to_board(event)
    s = state["striker"]
    dx, dy = s["x"] - x, s["y"] - y
    d = math.hypot(dx, dy)
    if d < 8: return
    power = min(d * PULL_FACTOR, MAX_POWER)
    s["vx"] = (dx/d) * power
    s["vy"] = (dy/d) * power
    state["phase"] = "moving"
    state["pocketed"] = 0
    state["moving_frames"] = 0

canvas.addEventListener("pointerdown", create_proxy(on_down))
canvas.addEventListener("pointermove", create_proxy(on_move))
canvas.addEventListener("pointerup",   create_proxy(on_up))

def update():
    if state["phase"] == "moving":
        for _ in range(SUBSTEPS):
            step_physics()
        state["moving_frames"] += 1
        if all_stopped() or state["moving_frames"] > 600:
            end_shot()
    elif state["phase"] == "aim" and state["turn"] == "ai":
        if state["ai_wait"] > 0:
            state["ai_wait"] -= 1
        else:
            execute_ai_shot()

def loop(timestamp):
    update()
    draw()
    window.requestAnimationFrame(create_proxy(loop))

document.getElementById("loading").style.display = "none"
document.getElementById("hud").style.display = "flex"
canvas.style.display = "block"
document.getElementById("hint").style.display = "block"
new_game()
window.requestAnimationFrame(create_proxy(loop))
</script>
